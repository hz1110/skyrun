<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#100f24">
<title>hz Admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --sky-dusk:#1b1b3a; --sky-deep:#100f24; --sky-mid:#2c2a55;
    --candle-gold:#ffc978;
    --cloud-white:#f5f3ff; --muted-teal:#5ec9c0; --soft-rose:#e98074;
    --line: rgba(245,243,255,0.14);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html{ background: var(--sky-deep); }
  body{
    margin:0; min-height:100vh; color:var(--cloud-white); font-family:'Nunito', sans-serif;
    background: radial-gradient(ellipse at 50% -10%, var(--sky-mid), var(--sky-dusk) 55%, var(--sky-deep) 100%);
  }
  ::selection{ background: var(--candle-gold); color: var(--sky-deep); }
  h1,h2{ font-family:'Cormorant Garamond', serif; margin:0; }
  .wrap{ max-width: 1200px; margin:0 auto; padding: 48px 24px 100px; }
  .admin-grid{ display:flex; flex-direction:column; gap:24px; }
  .admin-grid .card{ margin-bottom:0; }
  .grid-side{ display:flex; flex-direction:column; gap:24px; }
  @media (min-width: 900px){
    .admin-grid{ display:grid; grid-template-columns: 2fr 1fr; align-items:start; }
  }
  .mono{ font-family:'JetBrains Mono', monospace; }

  #loginBox{ max-width:360px; margin: 80px auto; text-align:center; }
  input, textarea, select{
    width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
    background: rgba(245,243,255,0.05); color:var(--cloud-white); font-family:'Nunito';
    margin-top:6px; margin-bottom:16px; font-size:14px;
  }
  textarea{ font-family:'JetBrains Mono'; font-size:12.5px; min-height:140px; resize:vertical; }
  label{ font-size:13px; color: rgba(245,243,255,0.6); display:block; }
  button{
    cursor:pointer; border:none; border-radius:8px; padding:10px 18px; font-weight:700;
    font-family:'Nunito'; font-size:14px; margin-right:8px; margin-bottom:8px;
  }
  .btn-primary{ background: var(--candle-gold); color:#1b1b3a; }
  .btn-secondary{ background: rgba(245,243,255,0.08); color:var(--cloud-white); border:1px solid var(--line); }
  .btn-danger{ background: rgba(233,128,116,0.18); color: var(--soft-rose); border:1px solid rgba(233,128,116,0.4); }

  .card{ border:1px solid var(--line); border-radius:14px; padding:24px; margin-bottom:24px; background: rgba(245,243,255,0.02); }
  .topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; }
  .msg{ font-size:13px; padding:10px 14px; border-radius:8px; margin-bottom:16px; }
  .msg.ok{ background: rgba(139,201,143,0.15); color:#8bc98f; }
  .msg.err{ background: rgba(233,128,116,0.15); color: var(--soft-rose); }
  .hint{ font-size:12.5px; color: rgba(245,243,255,0.45); margin-top:-8px; margin-bottom:16px; }
  #hidden{ display:none; }
  .applicant-row{ border-bottom:1px dashed var(--line); padding:10px 0; font-size:13px; }
  .applicant-row:last-child{ border-bottom:none; }
  .applicant-row .d{ color: var(--candle-gold); font-weight:700; }
  .applicant-row .meta{ color: rgba(245,243,255,0.55); font-size:12px; margin-top:3px; }
</style>
</head>
<body>

<div class="wrap">
  <div id="loginBox">
    <label>Email</label>
    <input id="email" type="email" placeholder="you@example.com">
    <label>Password</label>
    <input id="password" type="password" placeholder="••••••••">
    <button class="btn-primary" id="loginBtn" style="width:100%;">Log In</button>
    <div class="msg err" id="loginMsg" style="display:none;"></div>
  </div>

  <div id="hidden">
    <div class="topbar">
      <button class="btn-secondary" id="logoutBtn">Log Out</button>
    </div>

    <div class="msg ok" id="saveMsg" style="display:none;"></div>
    <div class="msg err" id="errMsg" style="display:none;"></div>

    <div class="card">
      <label>Maintenance Mode — while On, index.html shows a maintenance screen to everyone instead of the site</label>
      <select id="maintenanceEnabledInput">
        <option value="false">Off</option>
        <option value="true">On</option>
      </select>
      <label>Message shown to visitors</label>
      <textarea id="maintenanceMsgInput" style="min-height:60px;">We're doing a bit of upkeep — check back soon!</textarea>
      <button class="btn-primary" id="saveMaintenanceBtn">Save Maintenance Settings</button>
    </div>

    <div class="admin-grid">
    <div class="card">
      <label>Load an existing run, or type a new date (YYYY-MM-DD) to create one</label>
      <select id="runSelect"><option value="">— New run —</option></select>
      <label>Run date (used as the run's ID and its Pacific Time/PST anchor date)</label>
      <input id="runDate" type="text" placeholder="2026-07-13">

      <label>Run Type — controls which graphic shows in the Live section</label>
      <select id="runTypeInput">
        <option value="candle">Candle Run (wax candle)</option>
        <option value="eden">Eden Run (Eden candle)</option>
        <option value="wingLight">Wing Light Run (Sky kid silhouette)</option>
      </select>

      <label>Timetable (JSON array — planned schedule, shown in Live section)</label>
      <textarea id="timetableInput">[
  { "time": "15:53", "label": "We all need to stay together!", "afk": true },
  { "time": "15:55", "label": "Fire Trial", "afk": false }
]</textarea>

      <label>Report (JSON array — actual timing; also drives the live status badge and the "Live" half of the candle while the run is active, and is shown in full once archived)</label>
      <textarea id="reportInput">[
  { "time": "15:53", "label": "Fire Trial", "delay": "minus", "minutes": 2, "delayLabel": "-2 mins" }
]</textarea>
      <div class="hint" id="autoReportHint" style="margin-top:-8px;">Select or save a run first.</div>
      <button type="button" class="btn-secondary" id="logNowBtn" disabled>⏱ Log Now</button>

      <label>Announcements for this Run (JSON array of strings — shown while this run is live/upcoming; HTML like &lt;a&gt; is allowed)</label>
      <textarea id="runAnnouncementsInput">[
  "📌 Don't forget to claim your Daily Quest rewards!"
]</textarea>

      <label>Accepting Applications for this Run — shows an "📝 Apply to Join" button next to this run on the site</label>
      <select id="runApplyEnabledInput">
        <option value="false">Off</option>
        <option value="true">On</option>
      </select>
      <label>Max Slots</label>
      <input id="runApplyMaxInput" type="number" min="0" step="1" value="0">
      <div class="hint" id="runApplyCountHint">Current applicants: 0 / 0</div>

      <label>"Before you apply..." popup for this run (JSON array of sections)</label>
      <textarea id="runApplyRulesInput" style="min-height:180px;">[
  {
    "title": "🤝 Rules",
    "items": [
      "⚠️ Set Aviary as home.",
      "📌 Auto-Hand. Refrain from releasing hands unless we are doing daily quest, meditating, or interacting with some objects.",
      "📌 Please try to teleport back if we get split. If you can't join me even with a minute, please directly reach me out with Discord Direct Message."
    ]
  },
  {
    "title": "🔍 Note!",
    "items": [
      "🤠 Once you're done interacting with any interact-ables, I'd appreciate it if you honk after interact!!!",
      "⛺ I'll use tent glitched Shared Memory, but sometimes I can't see those Shared Memories. You can release our hands and lead me up to teleport if you can see Shared Memories first.",
      "👥 No extra sky kids from your constellation allowed. I don't mind if your friend joins us suddenly, but I won't wait around for your friends to move areas. But, my alternative account may be joining us as well.(?!)",
      "🔇 Preferred Quiet Run. Because my English is pretty bad, so I want to avoid chatting for more focusing on collecting our wax! You can chat if you have any inquiries, of course."
    ]
  }
]</textarea>

      <button class="btn-primary" id="saveBtn">Save Run</button>
      <button class="btn-secondary" id="setLiveBtn">Set as Live Run</button>
      <button class="btn-secondary" id="endLiveBtn">End Run (Move to Archive)</button>
      <button class="btn-danger" id="resetRunApplyBtn">Reset Applications for this Run</button>
      <button class="btn-danger" id="deleteBtn">Delete Run</button>
    </div>

    <div class="grid-side">
      <div class="card">
        <div class="hint" style="margin-top:0;">Currently live run:</div>
        <div id="currentLiveDisplay" class="mono" style="font-size:14px;">—</div>
      </div>

      <div class="card">
        <div class="hint" style="margin-top:0;">Applicants (all runs)</div>
        <div id="applicantList">Loading...</div>
      </div>
    </div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, doc, setDoc, getDoc, deleteDoc, collection, getDocs, onSnapshot, orderBy, query, where
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ====== PASTE THE SAME FIREBASE CONFIG AS index.html ======
  const firebaseConfig = {
    apiKey: "AIzaSyD4TFAfwXiWSLNGkcXqWLv7cfB85iczmg8",
    authDomain: "sky-colt-for-candle-run.firebaseapp.com",
    projectId: "sky-colt-for-candle-run",
    storageBucket: "sky-colt-for-candle-run.firebasestorage.app",
    messagingSenderId: "924531234237",
    appId: "1:924531234237:web:fc6b1e4ea39be1eb58eed4"
  };
  // ============================================================

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // ---------- Pacific Time helpers (mirrors index.html — the game's own timezone) ----------
  const GAME_TZ = 'America/Los_Angeles';
  function getTimeZoneOffsetMinutes(date, timeZone){
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone, hourCycle: 'h23',
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
    }).formatToParts(date).reduce((acc, p) => { acc[p.type] = p.value; return acc; }, {});
    const asUTC = Date.UTC(parts.year, parts.month - 1, parts.day, parts.hour, parts.minute, parts.second);
    return (asUTC - date.getTime()) / 60000;
  }
  function pstToDate(dateStr, hhmm){
    const [y, m, d] = dateStr.split('-').map(Number);
    const [hh, mm] = hhmm.split(':').map(Number);
    let utc = Date.UTC(y, m - 1, d, hh, mm, 0);
    for(let i = 0; i < 2; i++){ // converges even right around a DST transition
      const offsetMin = getTimeZoneOffsetMinutes(new Date(utc), GAME_TZ);
      utc = Date.UTC(y, m - 1, d, hh, mm, 0) - offsetMin * 60000;
    }
    return new Date(utc);
  }
  function nowAsPstHHMM(){
    return new Intl.DateTimeFormat('en-US', { timeZone: GAME_TZ, hourCycle: 'h23', hour: '2-digit', minute: '2-digit' }).format(new Date());
  }

  const loginBox = document.getElementById('loginBox');
  const hidden = document.getElementById('hidden');
  const loginMsg = document.getElementById('loginMsg');

  document.getElementById('loginBtn').onclick = async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    try{
      await signInWithEmailAndPassword(auth, email, password);
    }catch(e){
      loginMsg.style.display = 'block';
      loginMsg.textContent = 'Login failed: ' + e.message;
    }
  };
  document.getElementById('logoutBtn').onclick = () => signOut(auth);

  onAuthStateChanged(auth, (user) => {
    if(user){
      loginBox.style.display = 'none';
      hidden.style.display = 'block';
      loadRunList();
      loadCurrentLive();
      loadMaintenanceConfig();
      subscribeApplicants();
    } else {
      loginBox.style.display = 'block';
      hidden.style.display = 'none';
    }
  });

  // ---------- Run list dropdown ----------
  const runSelect = document.getElementById('runSelect');
  const runDateInput = document.getElementById('runDate');
  const runTypeInput = document.getElementById('runTypeInput');
  const timetableInput = document.getElementById('timetableInput');
  const reportInput = document.getElementById('reportInput');
  const runAnnouncementsInput = document.getElementById('runAnnouncementsInput');
  const maintenanceEnabledInput = document.getElementById('maintenanceEnabledInput');
  const maintenanceMsgInput = document.getElementById('maintenanceMsgInput');
  const runApplyEnabledInput = document.getElementById('runApplyEnabledInput');
  const runApplyMaxInput = document.getElementById('runApplyMaxInput');
  const runApplyCountHint = document.getElementById('runApplyCountHint');
  const runApplyRulesInput = document.getElementById('runApplyRulesInput');
  const applicantListEl = document.getElementById('applicantList');
  const saveMsg = document.getElementById('saveMsg');
  const errMsg = document.getElementById('errMsg');
  const currentLiveDisplay = document.getElementById('currentLiveDisplay');

  function showOk(msg){ saveMsg.style.display='block'; saveMsg.textContent = msg; errMsg.style.display='none'; setTimeout(()=>saveMsg.style.display='none', 3500); }
  function showErr(msg){ errMsg.style.display='block'; errMsg.textContent = msg; saveMsg.style.display='none'; }

  function runTypeLabel(type){
    if(type === 'eden') return 'Eden Run';
    if(type === 'wingLight') return 'Wing Light Run';
    return 'Candle Run';
  }
  // Each run is stored under its own "date_type" document, so a Candle Run
  // and a Wing Light Run on the same date never overwrite each other.
  function makeRunId(runDate, runType){
    return `${runDate}_${runType}`;
  }

  async function loadRunList(){
    const snap = await getDocs(query(collection(db, 'runs'), orderBy('date', 'desc')));
    runSelect.innerHTML = '<option value="">— New run —</option>';
    snap.forEach(d => {
      const data = d.data();
      const opt = document.createElement('option');
      opt.value = d.id;
      opt.textContent = `${data.date || d.id} · ${runTypeLabel(data.runType)}`;
      runSelect.appendChild(opt);
    });
  }

  async function loadCurrentLive(){
    const snap = await getDoc(doc(db, 'meta', 'current'));
    const activeRunId = snap.exists() ? snap.data().activeRunId : null;
    if(!activeRunId){ currentLiveDisplay.textContent = 'None'; return; }
    const runSnap = await getDoc(doc(db, 'runs', activeRunId));
    currentLiveDisplay.textContent = runSnap.exists()
      ? `${runSnap.data().date || activeRunId} · ${runTypeLabel(runSnap.data().runType)}`
      : activeRunId;
  }

  const DEFAULT_RUN_APPLY_RULES = [
    {
      title: '🤝 Rules',
      items: [
        '⚠️ Set Aviary as home.',
        '📌 Auto-Hand. Refrain from releasing hands unless we are doing daily quest, meditating, or interacting with some objects.',
        "📌 Please try to teleport back if we get split. If you can't join me even with a minute, please directly reach me out with Discord Direct Message.",
      ],
    },
    {
      title: '🔍 Note!',
      items: [
        "🤠 Once you're done interacting with any interact-ables, I'd appreciate it if you honk after interact!!!",
        "⛺ I'll use tent glitched Shared Memory, but sometimes I can't see those Shared Memories. You can release our hands and lead me up to teleport if you can see Shared Memories first.",
        "👥 No extra sky kids from your constellation allowed. I don't mind if your friend joins us suddenly, but I won't wait around for your friends to move areas. But, my alternative account may be joining us as well.(?!)",
        "🔇 Preferred Quiet Run. Because my English is pretty bad, so I want to avoid chatting for more focusing on collecting our wax! You can chat if you have any inquiries, of course.",
      ],
    },
  ];

  // Loads the per-run application settings (Accepting Applications / Max Slots /
  // rules popup) into the form. Pass no id (new run) to reset to defaults.
  async function loadRunApplyConfig(runId){
    if(!runId){
      runApplyEnabledInput.value = 'false';
      runApplyMaxInput.value = '0';
      runApplyRulesInput.value = JSON.stringify(DEFAULT_RUN_APPLY_RULES, null, 2);
      runApplyCountHint.textContent = 'Current applicants: 0 / 0';
      return;
    }
    const snap = await getDoc(doc(db, 'runApplications', runId));
    const data = snap.exists() ? snap.data() : { enabled: false, maxSlots: 0, count: 0, rules: DEFAULT_RUN_APPLY_RULES };
    runApplyEnabledInput.value = String(!!data.enabled);
    runApplyMaxInput.value = data.maxSlots ?? 0;
    runApplyRulesInput.value = JSON.stringify(Array.isArray(data.rules) ? data.rules : DEFAULT_RUN_APPLY_RULES, null, 2);
    runApplyCountHint.textContent = `Current applicants: ${data.count ?? 0} / ${data.maxSlots ?? 0}`;
  }

  async function loadMaintenanceConfig(){
    const snap = await getDoc(doc(db, 'meta', 'maintenance'));
    const data = snap.exists() ? snap.data() : { enabled: false, message: '' };
    maintenanceEnabledInput.value = String(!!data.enabled);
    maintenanceMsgInput.value = data.message || "We're doing a bit of upkeep — check back soon!";
  }

  function subscribeApplicants(){
    onSnapshot(query(collection(db, 'applications'), orderBy('submittedAt', 'desc')), (snap) => {
      if(snap.empty){
        applicantListEl.innerHTML = '<div class="hint" style="margin:0;">No applicants yet.</div>';
        return;
      }
      applicantListEl.innerHTML = snap.docs.map(d => {
        const a = d.data();
        const when = a.submittedAt && a.submittedAt.toDate ? a.submittedAt.toDate().toLocaleString() : 'just now';
        return `
          <div class="applicant-row">
            <div class="d">${a.discord || '—'}</div>
            <div>Sky nickname: ${a.nickname || '—'}</div>
            <div>Friend code: ${a.alreadyFriends ? "Already friends" : (a.friendCode || '—')}</div>
            <div class="meta">Run: ${a.runId || 'Legacy (no run)'} · ${when}</div>
            <button class="btn-danger" data-id="${d.id}" data-run-id="${a.runId || ''}" style="margin-top:8px; padding:6px 12px; font-size:12.5px;">Delete</button>
          </div>
        `;
      }).join('');
    });
  }

  applicantListEl.addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-id]');
    if(!btn) return;
    if(!confirm('Delete this applicant?')) return;
    try{
      await deleteDoc(doc(db, 'applications', btn.dataset.id));
      const runId = btn.dataset.runId;
      if(runId){
        const applySnap = await getDoc(doc(db, 'runApplications', runId));
        const count = applySnap.exists() ? (Number(applySnap.data().count) || 0) : 0;
        await setDoc(doc(db, 'runApplications', runId), { count: Math.max(0, count - 1) }, { merge: true });
        if(runSelect.value === runId) loadRunApplyConfig(runId);
      }
      showOk('Applicant deleted.');
    }catch(err){
      showErr(err.message);
    }
  });

  runSelect.onchange = async () => {
    const id = runSelect.value;
    if(!id){
      runDateInput.value = '';
      runTypeInput.value = 'candle';
      timetableInput.value = '[]';
      reportInput.value = '[]';
      runAnnouncementsInput.value = '[]';
      loadRunApplyConfig(null);
      updateAutoReportUI();
      return;
    }
    const snap = await getDoc(doc(db, 'runs', id));
    if(snap.exists()){
      const data = snap.data();
      runDateInput.value = data.date || id;
      runTypeInput.value = data.runType || 'candle';
      timetableInput.value = JSON.stringify(data.timetable || [], null, 2);
      reportInput.value = JSON.stringify(data.report || [], null, 2);
      runAnnouncementsInput.value = JSON.stringify(data.announcements || [], null, 2);
    }
    loadRunApplyConfig(id);
    updateAutoReportUI();
  };

  // ---------- "⏱ Log Now" — auto-fills the next unreported Timetable step's delay ----------
  const autoReportHintEl = document.getElementById('autoReportHint');
  const logNowBtnEl = document.getElementById('logNowBtn');

  // The next step to report is always the one right after however many steps
  // are already in Report — admins report in the same order they wrote Timetable.
  function updateAutoReportUI(){
    if(!runSelect.value){
      autoReportHintEl.textContent = 'Select or save a run first.';
      logNowBtnEl.disabled = true;
      return;
    }
    let timetable, report;
    try{ timetable = JSON.parse(timetableInput.value); }catch(e){ timetable = null; }
    try{ report = JSON.parse(reportInput.value); }catch(e){ report = null; }
    if(!Array.isArray(timetable) || timetable.length === 0){
      autoReportHintEl.textContent = 'Add timetable steps first.';
      logNowBtnEl.disabled = true;
      return;
    }
    if(!Array.isArray(report)) report = [];
    const next = timetable[report.length];
    if(!next){
      autoReportHintEl.textContent = 'All timetable steps are already reported.';
      logNowBtnEl.disabled = true;
      return;
    }
    autoReportHintEl.textContent = `Next: ${next.time} — ${next.label}`;
    logNowBtnEl.disabled = false;
  }
  timetableInput.addEventListener('input', updateAutoReportUI);
  reportInput.addEventListener('input', updateAutoReportUI);

  logNowBtnEl.onclick = async () => {
    try{
      const runId = runSelect.value;
      if(!runId) throw new Error('Select a saved run first.');
      const runDate = runDateInput.value.trim();
      if(!/^\d{4}-\d{2}-\d{2}$/.test(runDate)) throw new Error('Run date must look like 2026-07-13.');
      const timetable = parseJsonField(timetableInput, 'Timetable');
      const report = parseJsonField(reportInput, 'Report');
      const next = timetable[report.length];
      if(!next) throw new Error('All timetable steps are already reported.');

      const now = new Date();
      const actualTime = nowAsPstHHMM();
      const plannedDate = pstToDate(runDate, next.time);
      const diffMin = Math.round((now - plannedDate) / 60000);
      const delay = diffMin > 0 ? 'plus' : diffMin < 0 ? 'minus' : 'none';
      const minutes = Math.abs(diffMin);
      const unit = minutes === 1 ? 'min' : 'mins';
      const delayLabel = diffMin === 0 ? 'No Delay' : `${diffMin > 0 ? '+' : ''}${diffMin} ${unit}`;

      const newReport = [...report, { time: actualTime, label: next.label, delay, minutes, delayLabel }];
      await setDoc(doc(db, 'runs', runId), { report: newReport }, { merge: true });
      reportInput.value = JSON.stringify(newReport, null, 2);
      updateAutoReportUI();
      showOk(`Logged "${next.label}" — ${delayLabel} (${actualTime}).`);
    }catch(e){
      showErr(e.message);
    }
  };

  function parseJsonField(el, name){
    try{
      return JSON.parse(el.value);
    }catch(e){
      throw new Error(`${name} isn't valid JSON: ${e.message}`);
    }
  }

  document.getElementById('saveBtn').onclick = async () => {
    try{
      const runDate = runDateInput.value.trim();
      if(!/^\d{4}-\d{2}-\d{2}$/.test(runDate)) throw new Error('Run date must look like 2026-07-13.');
      const runType = runTypeInput.value;
      const runId = makeRunId(runDate, runType);
      const timetable = parseJsonField(timetableInput, 'Timetable');
      const report = parseJsonField(reportInput, 'Report');
      const announcements = parseJsonField(runAnnouncementsInput, 'Announcements');
      const applyEnabled = runApplyEnabledInput.value === 'true';
      const applyMaxSlots = parseInt(runApplyMaxInput.value, 10) || 0;
      const applyRules = parseJsonField(runApplyRulesInput, 'Apply Rules');

      await setDoc(doc(db, 'runs', runId), { date: runDate, runType, timetable, report, announcements });

      const existingApply = await getDoc(doc(db, 'runApplications', runId));
      const applyPayload = { enabled: applyEnabled, maxSlots: applyMaxSlots, rules: applyRules };
      if(!existingApply.exists()) applyPayload.count = 0;
      await setDoc(doc(db, 'runApplications', runId), applyPayload, { merge: true });

      showOk(`Saved ${runTypeLabel(runType)} for ${runDate}.`);
      await loadRunList();
      runSelect.value = runId;
      loadRunApplyConfig(runId);
      updateAutoReportUI();
    }catch(e){
      showErr(e.message);
    }
  };

  document.getElementById('saveMaintenanceBtn').onclick = async () => {
    try{
      const enabled = maintenanceEnabledInput.value === 'true';
      const message = maintenanceMsgInput.value.trim();
      await setDoc(doc(db, 'meta', 'maintenance'), { enabled, message });
      showOk(enabled ? 'Maintenance mode is ON — the site is hidden from visitors.' : 'Maintenance mode is OFF.');
    }catch(e){
      showErr(e.message);
    }
  };

  document.getElementById('resetRunApplyBtn').onclick = async () => {
    try{
      const runId = runSelect.value;
      if(!runId) throw new Error('Select a saved run first.');
      if(!confirm('Delete all applicants for this run and reset its count to 0? This cannot be undone.')) return;
      const snap = await getDocs(query(collection(db, 'applications'), where('runId', '==', runId)));
      await Promise.all(snap.docs.map(d => deleteDoc(d.ref)));
      await setDoc(doc(db, 'runApplications', runId), { count: 0 }, { merge: true });
      showOk('Applications reset for this run.');
      loadRunApplyConfig(runId);
    }catch(e){
      showErr(e.message);
    }
  };

  document.getElementById('setLiveBtn').onclick = async () => {
    try{
      const runDate = runDateInput.value.trim();
      if(!runDate) throw new Error('Save the run first, then set it live.');
      const runId = makeRunId(runDate, runTypeInput.value);
      const runSnap = await getDoc(doc(db, 'runs', runId));
      if(!runSnap.exists()) throw new Error('Save the run first, then set it live.');
      await setDoc(doc(db, 'meta', 'current'), { activeRunId: runId });
      await setDoc(doc(db, 'runs', runId), { ended: false }, { merge: true });
      showOk(`${runTypeLabel(runTypeInput.value)} (${runDate}) is now the live run.`);
      loadCurrentLive();
    }catch(e){
      showErr(e.message);
    }
  };

  document.getElementById('endLiveBtn').onclick = async () => {
    try{
      const currentSnap = await getDoc(doc(db, 'meta', 'current'));
      const endedRunId = currentSnap.exists() ? currentSnap.data().activeRunId : null;
      if(!endedRunId) throw new Error('No run is currently live — nothing to end. (Did you mean to click "Set as Live Run" first?)');
      await setDoc(doc(db, 'meta', 'current'), { activeRunId: null });
      // Flag the run itself as ended so it goes straight to the archive
      // regardless of its date — a future-dated run just ended early
      // would otherwise still look "upcoming" and stay in Progress.
      await setDoc(doc(db, 'runs', endedRunId), { ended: true }, { merge: true });
      showOk('Run ended and moved to the archive.');
      loadCurrentLive();
    }catch(e){
      showErr(e.message);
    }
  };

  document.getElementById('deleteBtn').onclick = async () => {
    try{
      const runId = runSelect.value;
      if(!runId) throw new Error('Select a saved run from the dropdown to delete it.');
      if(!confirm(`Delete run ${runId}? This also deletes its application settings and applicants. This cannot be undone.`)) return;
      await deleteDoc(doc(db, 'runs', runId));
      await deleteDoc(doc(db, 'runApplications', runId));
      const appSnap = await getDocs(query(collection(db, 'applications'), where('runId', '==', runId)));
      await Promise.all(appSnap.docs.map(d => deleteDoc(d.ref)));
      showOk(`Deleted run ${runId}.`);
      runSelect.value = '';
      runDateInput.value = '';
      runTypeInput.value = 'candle';
      timetableInput.value = '[]';
      reportInput.value = '[]';
      runAnnouncementsInput.value = '[]';
      loadRunApplyConfig(null);
      updateAutoReportUI();
      await loadRunList();
    }catch(e){
      showErr(e.message);
    }
  };
</script>

</body>
</html>
